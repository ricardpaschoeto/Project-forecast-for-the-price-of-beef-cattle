[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data_pipeline"
version = "0.1.0"
description = "Seu pipeline de dados"
authors = [{ name = "Ricardo Luiz Moreira Paschoeto" }]
readme = "README.md"
requires-python = ">=3.9"

# Dependências do projeto (se houver)
# dependencies = ["pandas>=2.0", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_pipeline*"]